<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Calculator App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="cal.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <header class="calculator__header">
        <h1>calc</h1>

        <div class="theme-control">
          <span class="theme-control__label">THEME</span>
          <fieldset class="theme-control__switch" aria-label="Theme selector">
            <div class="theme-control__numbers" aria-hidden="true">
              <span>1</span>
              <span>2</span>
              <span>3</span>
            </div>
            <div class="theme-control__track">
              <label>
                <input type="radio" name="theme" value="1" checked />
                <span>Theme 1</span>
              </label>
              <label>
                <input type="radio" name="theme" value="2" />
                <span>Theme 2</span>
              </label>
              <label>
                <input type="radio" name="theme" value="3" />
                <span>Theme 3</span>
              </label>
              <span class="theme-control__thumb" aria-hidden="true"></span>
            </div>
          </fieldset>
        </div>
      </header>

      <output class="calculator__screen" aria-live="polite">0</output>

      <section class="calculator__keys" aria-label="Calculator keypad">
        <button class="key" type="button" data-key="7">7</button>
        <button class="key" type="button" data-key="8">8</button>
        <button class="key" type="button" data-key="9">9</button>
        <button class="key key--control" type="button" data-action="delete">
          DEL
        </button>

        <button class="key" type="button" data-key="4">4</button>
        <button class="key" type="button" data-key="5">5</button>
        <button class="key" type="button" data-key="6">6</button>
        <button class="key" type="button" data-operator="+">+</button>

        <button class="key" type="button" data-key="1">1</button>
        <button class="key" type="button" data-key="2">2</button>
        <button class="key" type="button" data-key="3">3</button>
        <button class="key" type="button" data-operator="-">-</button>

        <button class="key" type="button" data-key=".">.</button>
        <button class="key" type="button" data-key="0">0</button>
        <button class="key" type="button" data-operator="/">/</button>
        <button class="key" type="button" data-operator="x">x</button>

        <button
          class="key key--control key--wide"
          type="button"
          data-action="reset"
        >
          RESET
        </button>
        <button
          class="key key--equals key--wide"
          type="button"
          data-action="equals"
        >
          =
        </button>
      </section>
    </main>

    <script src="cal.js"></script>
  </body>
</html>
